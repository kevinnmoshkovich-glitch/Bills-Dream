<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO BILLS</title>
<meta name="description" content="GO BILLS. Definitely. Move your mouse.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Anton',sans-serif;background:#000;cursor:default;}
.scene{position:fixed;inset:0;perspective:1100px;}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;
  will-change:-webkit-mask-image,mask-image;
}
/* BILLS face */
.a{background:radial-gradient(ellipse 90% 70% at 50% 40%, #0a4ab8, #00338D 60%, #001F5C);}
.a h1{
  font-size:clamp(64px,17vw,220px);line-height:.95;color:#fff;text-transform:uppercase;
  text-shadow:6px 6px 0 #C60C30, 0 0 60px rgba(255,255,255,.25);
}
.a .sub{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.4em;color:#F2F4F8;font-size:clamp(11px,2.4vw,16px);margin-top:22px;text-transform:uppercase;opacity:.9;}
/* GIANTS face */
.b{background:radial-gradient(ellipse 90% 70% at 50% 40%, #16409e, #0B2265 60%, #050f30);}
.b .jk{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.5em;color:#F2C14E;font-size:clamp(13px,3vw,22px);text-transform:uppercase;margin-bottom:14px;}
.b h1{
  font-size:clamp(52px,14vw,190px);line-height:.95;color:#fff;text-transform:uppercase;
  text-shadow:6px 6px 0 #A71930, 0 0 70px rgba(242,193,78,.35);
}
.b h1 .gold{color:#F2C14E;text-shadow:6px 6px 0 #A71930;}
.b .statue{font-size:clamp(40px,8vw,84px);margin-top:16px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));}
.b .more{
  font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(11px,2.2vw,14px);
  letter-spacing:.25em;text-transform:uppercase;color:#F2F4F8;
  margin-top:30px;text-decoration:none;border:2px solid #F2C14E;padding:12px 26px;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  opacity:0;transition:opacity .5s;pointer-events:none;background:rgba(242,193,78,.08);
}
.b .more.show{opacity:1;pointer-events:auto;}
.b .more:hover{background:#F2C14E;color:#0B2265;}
.hint{
  position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:5;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.25em;
  color:rgba(255,255,255,.55);text-transform:uppercase;pointer-events:none;
  transition:opacity .6s;
}
.hint.gone{opacity:0;}
.sheen{
  position:fixed;inset:0;pointer-events:none;z-index:4;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 48%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.16) 52%,transparent 70%);
  background-size:300% 100%;background-position:calc(var(--t,0)*100%) 0;
  opacity:.8;
}
@media (prefers-reduced-motion:reduce){.sheen{display:none;}}
</style>
</head>
<body>
<div class="scene">
  <div class="tilt" id="tilt">
    <div class="face a" id="fa">
      <h1>GO<br>BILLS</h1>
      <div class="sub">Buffalo Forever · Est. 1960</div>
    </div>
    <div class="face b" id="fb">
      <div class="jk">Just Kidding</div>
      <h1>GO <span class="gold">BIG</span><br><span class="gold">BLUE</span></h1>
      <div class="statue">🗽</div>
      <a class="more" id="more" href="/stats">See the full statistical destruction →</a>
    </div>
  </div>
</div>
<div class="sheen" aria-hidden="true"></div>
<div class="hint" id="hint">← Move your mouse · Tilt your phone →</div>

<script>
(function(){
const tilt=document.getElementById('tilt'),fa=document.getElementById('fa'),fb=document.getElementById('fb');
const hint=document.getElementById('hint'),more=document.getElementById('more');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STRIP=18; // lenticular strip width px
let target=0, t=0, interacted=false, revealed=false;

function setLenticular(v){
  // v: 0 = full BILLS, 1 = full GIANTS
  const wa=Math.max(0,(1-v))*STRIP, wb=Math.max(0,v)*STRIP;
  const mA=`repeating-linear-gradient(90deg, #000 0 ${wa}px, transparent ${wa}px ${STRIP}px)`;
  const mB=`repeating-linear-gradient(90deg, transparent 0 ${wa}px, #000 ${wa}px ${STRIP}px)`;
  fa.style.webkitMaskImage=mA; fa.style.maskImage=mA;
  fb.style.webkitMaskImage=mB; fb.style.maskImage=mB;
  // physical tilt of the whole plane
  if(!reduced) tilt.style.transform=`rotateY(${(v-.5)*16}deg) rotateX(${Math.sin(v*Math.PI)*-2}deg)`;
  document.documentElement.style.setProperty('--t',v);
  document.title = v>.5 ? 'GO BIG BLUE' : 'GO BILLS';
}
setLenticular(0);

function loop(){
  t += (target-t)*0.12;           // eased, like turning a lenticular card
  setLenticular(Math.max(0,Math.min(1,t)));
  if(t>.92 && !revealed){revealed=true;more.classList.add('show');
    if(navigator.vibrate)navigator.vibrate([20,30,60]);}
  if(t<.5) revealed=false, more.classList.remove('show');
  requestAnimationFrame(loop);
}
loop();

function interact(){if(!interacted){interacted=true;hint.classList.add('gone');}}

/* mouse: horizontal position = viewing angle */
addEventListener('pointermove',e=>{interact();target=e.clientX/innerWidth;},{passive:true});
/* touch drag for phones without gyro permission */
addEventListener('touchmove',e=>{interact();target=e.touches[0].clientX/innerWidth;},{passive:true});
/* gyroscope: tilt the phone like a lenticular card */
addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;interact();
  target=Math.max(0,Math.min(1,(e.gamma+35)/70));
},{passive:true});
/* click anywhere also flips it, for the impatient */
addEventListener('click',e=>{if(e.target.closest('a'))return;interact();target=target>.5?0:1;});
})();
</script>
</body>
</html>
