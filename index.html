<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO BILLS</title>
<meta name="description" content="GO BILLS. Definitely. Move your mouse.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="prefetch" href="/stats">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Anton',sans-serif;background:#000;}
.scene{position:fixed;inset:0;perspective:1100px;opacity:0;animation:enter 1.1s .1s ease forwards;}
@keyframes enter{from{opacity:0;}to{opacity:1;}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;
}
.face .inner{will-change:transform;display:flex;flex-direction:column;align-items:center;}
/* BILLS face */
.a{background:radial-gradient(ellipse 90% 70% at 50% 38%, #0a4ab8, #00338D 60%, #001a4d);}
.a h1{
  font-size:clamp(64px,17vw,220px);line-height:.93;color:#fff;text-transform:uppercase;
  text-shadow:6px 6px 0 #C60C30, 0 0 60px rgba(255,255,255,.22);
  letter-spacing:.01em;
}
.a .sub{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.42em;color:#F2F4F8;font-size:clamp(11px,2.4vw,16px);margin-top:24px;text-transform:uppercase;opacity:.85;}
/* GIANTS face */
.b{background:radial-gradient(ellipse 90% 70% at 50% 38%, #16409e, #0B2265 60%, #040c28);}
.b .jk{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.55em;color:#F2C14E;font-size:clamp(13px,3vw,22px);text-transform:uppercase;margin-bottom:16px;text-shadow:0 0 24px rgba(242,193,78,.5);}
.b h1{
  font-size:clamp(52px,14vw,190px);line-height:.93;color:#fff;text-transform:uppercase;
  text-shadow:6px 6px 0 #A71930, 0 0 70px rgba(242,193,78,.3);
}
.b h1 .gold{color:#F2C14E;text-shadow:6px 6px 0 #A71930, 0 0 50px rgba(242,193,78,.45);}
.b .statue{font-size:clamp(40px,8vw,84px);margin-top:18px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));}
.b .more{
  font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(11px,2.2vw,14px);
  letter-spacing:.25em;text-transform:uppercase;color:#F2F4F8;
  margin-top:32px;text-decoration:none;border:2px solid #F2C14E;padding:13px 28px;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s,background .25s,color .25s;
  pointer-events:none;background:rgba(242,193,78,.08);
}
.b .more.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.b .more:hover{background:#F2C14E;color:#0B2265;}
/* overlays */
.hint{
  position:fixed;bottom:28px;left:0;right:0;text-align:center;z-index:6;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.28em;
  color:rgba(255,255,255,.6);text-transform:uppercase;pointer-events:none;
  transition:opacity .7s;animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.45;}50%{opacity:.85;}}
.hint.gone{opacity:0;animation:none;}
.sheen{
  position:fixed;inset:0;pointer-events:none;z-index:4;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.13) 47%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.13) 53%,transparent 68%);
  background-size:280% 100%;background-position:calc(var(--t,0)*100%) 0;
}
.foil{
  position:fixed;inset:0;pointer-events:none;z-index:3;mix-blend-mode:overlay;opacity:.5;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 18px),
    linear-gradient(calc(90deg + var(--t,0)*40deg), rgba(255,80,120,.06), rgba(80,255,220,.06) 50%, rgba(255,220,80,.06));
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse 110% 100% at 50% 45%, transparent 62%, rgba(0,0,0,.55));}
@media (prefers-reduced-motion:reduce){.sheen,.foil{display:none;}.hint{animation:none;}}
</style>
</head>
<body>
<div class="scene">
  <div class="tilt" id="tilt">
    <div class="face a" id="fa"><div class="inner" id="ia">
      <h1>GO<br>BILLS</h1>
      <div class="sub">Buffalo Forever · Est. 1960</div>
    </div></div>
    <div class="face b" id="fb"><div class="inner" id="ib">
      <div class="jk">Just Kidding</div>
      <h1>GO <span class="gold">BIG</span><br><span class="gold">BLUE</span></h1>
      <div class="statue">🗽</div>
      <a class="more" id="more" href="/stats">See the full statistical destruction →</a>
    </div></div>
  </div>
</div>
<div class="foil" aria-hidden="true"></div>
<div class="sheen" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="hint" id="hint">Move your mouse →</div>

<script>
(function(){
const tilt=document.getElementById('tilt'),fa=document.getElementById('fa'),fb=document.getElementById('fb');
const ia=document.getElementById('ia'),ib=document.getElementById('ib');
const hint=document.getElementById('hint'),more=document.getElementById('more');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchDevice=matchMedia('(pointer: coarse)').matches;
hint.textContent = touchDevice ? 'Tilt your phone · or swipe' : 'Move your mouse →';

const STRIP=16;
let target=0, t=0, interacted=false, revealed=false, lastMove=Date.now(), idlePhase=0;
let AC=null;
function shimmer(){ // tiny audio tick when crossing the middle (only after user gesture unlocks audio)
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')return;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(1400,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(2600,AC.currentTime+.09);
    g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.linearRampToValueAtTime(.05,AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.15);
  }catch(e){}
}

function render(v){
  const wa=Math.max(0,(1-v))*STRIP, wb=Math.max(0,v)*STRIP;
  const mA=`repeating-linear-gradient(90deg, #000 0 ${wa}px, transparent ${wa}px ${STRIP}px)`;
  const mB=`repeating-linear-gradient(90deg, transparent 0 ${wa}px, #000 ${wa}px ${STRIP}px)`;
  fa.style.webkitMaskImage=mA; fa.style.maskImage=mA;
  fb.style.webkitMaskImage=mB; fb.style.maskImage=mB;
  if(!reduced){
    tilt.style.transform=`rotateY(${(v-.5)*17}deg) rotateX(${Math.sin(v*Math.PI)*-2.2}deg)`;
    /* depth parallax: text floats above its background */
    ia.style.transform=`translateX(${(v-.5)*-34}px)`;
    ib.style.transform=`translateX(${(v-.5)*-34 + 0}px) translateX(${(1-v)*26}px)`;
  }
  document.documentElement.style.setProperty('--t',v);
}
render(0);

let prevSide=0;
function loop(){
  const idle = Date.now()-lastMove > 2600 && !interactedRecently();
  if(idle && !reduced){
    /* attract mode: gentle sway teasing a sliver of the hidden face */
    idlePhase+=0.014;
    target = interacted ? target : 0.06 + Math.max(0,Math.sin(idlePhase))*0.10;
  }
  /* magnetic snap once user stops moving */
  if(interacted && Date.now()-lastMove>650){
    target += ((target>.5?1:0)-target)*0.06;
  }
  t += (target-t)*0.14;
  const v=Math.max(0,Math.min(1,t));
  render(v);
  const side=v>.5?1:0;
  if(side!==prevSide){shimmer();if(navigator.vibrate)navigator.vibrate(12);prevSide=side;}
  if(v>.9 && !revealed){revealed=true;more.classList.add('show');if(navigator.vibrate)navigator.vibrate([20,30,70]);}
  if(v<.5 && revealed){revealed=false;more.classList.remove('show');}
  requestAnimationFrame(loop);
}
function interactedRecently(){return Date.now()-lastMove<2600;}
loop();

function poke(){lastMove=Date.now();if(!interacted){interacted=true;hint.classList.add('gone');}}
addEventListener('pointermove',e=>{poke();target=e.clientX/innerWidth;},{passive:true});
addEventListener('touchmove',e=>{poke();target=e.touches[0].clientX/innerWidth;},{passive:true});
addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;poke();
  target=Math.max(0,Math.min(1,(e.gamma+32)/64));
},{passive:true});
addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  poke();try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();}catch(err){}
  target=t>.5?0:1;
});
/* iOS gyro permission: first tap requests it quietly */
addEventListener('touchend',function req(){
  if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
  removeEventListener('touchend',req);
},{once:true});
})();
</script>
</body>
</html>
