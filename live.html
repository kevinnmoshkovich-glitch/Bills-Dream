<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lose);margin-right:5px;vertical-align:1px;animation:pulse 1.4s infinite}
.dot.off{background:var(--mut);animation:none}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:#0f2a1f;border:1px solid rgba(57,217,138,.6);color:#d9ffe9;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .3s ease-out}
.toast.bad{background:#2a0f16;border-color:rgba(255,90,110,.6);color:#ffd9df}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.home{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--mut)}
@media (max-width:420px){.sc{font-size:36px}.sum b{font-size:15px}.rh b{font-size:18px}}
</style>

<script>
'use strict';
const API='https://site.api.espn.com/apis/site/v2/sports/football/nfl/';
const STAT={
  pass_yds:{cat:'passing',key:'passingYards',lab:'passing yds',short:'pass yds',yards:1},
  pass_td:{cat:'passing',key:'passingTouchdowns',lab:'passing TD',short:'pass TD'},
  rush_yds:{cat:'rushing',key:'rushingYards',lab:'rushing yds',short:'rush yds',yards:1},
  rec_yds:{cat:'receiving',key:'receivingYards',lab:'receiving yds',short:'rec yds',yards:1},
  rec:{cat:'receiving',key:'receptions',lab:'receptions',short:'catches'},
  atd:{lab:'anytime TD',short:'TD'},
  ml:{lab:'to win',short:'win'}
};
const ORDER=['pass_yds','pass_td','rush_yds','rec_yds','rec','atd'];
const LIVE_MS=15000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Math.round(Number(n)).toLocaleString('en-US');
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]+/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,' ').replace(/\s+/g,' ').trim();
const surname=n=>{const w=String(n||'').split(' ').filter(x=>!/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(x));return w[w.length-1]||n};

let BETS=null,G={},SCHED={},schedAt=0,lastOk=0,timer=null,errMsg='',booted=false;
let prevVal={},prevLeg={},prevSlip={};

async function getJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- parse ESPN summary ---------- */
function parseBox(sum){
  const byId={},byName={};
  const teams=(sum.boxscore&&sum.boxscore.players)||[];
  for(const tp of teams){
    const team=tp.team&&tp.team.abbreviation;
    for(const cat of tp.statistics||[]){
      const keys=cat.keys||[];
      for(const a of cat.athletes||[]){
        const at=a.athlete||{};
        let r=byId[at.id];
        if(!r){r=byId[at.id]={id:at.id,name:at.displayName,team,c:{},s:{}};byName[norm(at.displayName)]=r;}
        const row={},raw={};
        keys.forEach((k,i)=>{row[k]=num(a.stats&&a.stats[i]);raw[k]=a.stats?a.stats[i]:'';});
        r.c[cat.name]=row;r.s[cat.name]=raw;
      }
    }
  }
  return{byId,byName};
}
function isTD(p){
  const a=[p.scoringType&&p.scoringType.name,p.scoringType&&p.scoringType.abbreviation,p.type&&p.type.text,p.type&&p.type.abbreviation].join(' ');
  return /touchdown|\bTD\b/i.test(a);
}
function clockFrac(st,state){
  if(state==='pre')return 0;
  if(state==='post')return 1;
  const p=st.period||1;if(p>4)return 1;
  let c=st.clock;
  if(c==null){const m=String(st.displayClock||'15:00').split(':');c=num(m[0])*60+num(m[1]);}
  return Math.min(1,Math.max(0,((p-1)*900+(900-c))/3600));
}
function buildGame(ev,sum){
  const comp=(sum.header&&sum.header.competitions&&sum.header.competitions[0])||{};
  const st=comp.status||{};const state=(st.type&&st.type.state)||'pre';
  const cur=sum.drives&&sum.drives.current;const plays=(cur&&cur.plays)||[];
  return{ev,sum,comp,st,state,comps:comp.competitors||[],box:parseBox(sum),
    tdTexts:(sum.scoringPlays||[]).filter(isTD).map(p=>norm(p.text)+' '),
    frac:clockFrac(st,state),lastPlay:plays[plays.length-1]||null};
}

/* ---------- legs ---------- */
const player=(g,l)=>(l.pid&&g.box.byId[l.pid])||g.box.byName[norm(l.p)]||null;
function tds(g,l){

    newly.forEach(n=>toast('✓ '+legName(g,n.l,true)+' — '+n.ids.join(' ')));
    const staked=ev.slips.reduce((a,s)=>a+s.stake,0),max=ev.slips.reduce((a,s)=>a+s.payout,0);
    const alive=res.reduce((a,r,i)=>a+(r.st!=='lost'?ev.slips[i].payout:0),0);
    const nAlive=res.filter(r=>r.st!=='lost').length;
    const worth=res.reduce((a,r,i)=>a+(r.p==null?0:r.p*ev.slips[i].payout),0),known=res.every(r=>r.p!=null);
    html+='<div class="sum"><div><span>Staked</span><b>'+money0(staked)+'</b></div><div><span>'+(g.state==='post'?'Returned':'Still alive')+'</span><b class="g">'+(g.state==='post'?money(res.reduce((a,r,i)=>a+(r.st==='won'?ev.slips[i].payout:0),0)):money0(alive))+'</b></div><div><span>'+(g.state==='post'?'Slips won':'Slips alive')+'</span><b>'+(g.state==='post'?res.filter(r=>r.st==='won').length:nAlive)+' / '+ev.slips.length+'</b></div>'+(g.state!=='post'&&known?'<div><span>Worth now*</span><b>'+money0(worth)+'</b></div>':'')+'</div>';
    html+='<div class="strip">'+res.map((r,i)=>{const s=ev.slips[i];
      const dots=r.legs.map(x=>'<i class="'+({hit:'h',won:'h',clear:'c',lost:'l',void:'v',live:''}[x.r.st])+'"></i>').join('');
      const lab=r.st==='won'?'won':r.st==='lost'?'out':'alive';
      return '<a class="chip '+r.st+'" href="#slip-'+esc(s.id)+'"><span class="id">'+esc(s.id)+'</span><span class="st">'+lab+'</span><div class="ct">'+r.hit+'/'+r.act.length+' in'+(r.st==='alive'&&r.p!=null?' · '+pct1(r.p):'')+'</div><div class="po">'+money0(s.payout)+'</div><div class="dots">'+dots+'</div></a>';
    }).join('')+'</div>';
    html+='<h2>By player<small>every line you need, live</small></h2>'+board(ev,g,flash);
    html+='<h2>Your slips<small>'+esc(ev.sub||'')+'</small></h2>'+res.map((r,i)=>slipCard(ev,g,ev.slips[i],r,flash)).join('');
  }
  html+=futures();
  html+='<div class="notes"><b>How legs are counted.</b> Anytime TD = a rushing, receiving or return touchdown (a passing TD doesn’t count for the passer). A yardage leg over its number shows <b>“over so far”</b> until the final whistle, because a sack, kneel-down or loss can pull the total back under. Numbers come from ESPN’s live box score and refresh every 15 seconds while the game is on; FanDuel settles on official stats. Puka Nacua was ruled out, so that leg on slip D is void.<br><b>*Chances are a rough guide.</b> Each leg starts from the sportsbook line for that player and shifts toward how he’s actually playing as the game goes on (the line counts as about a game and a half of evidence); a slip’s chance multiplies its legs as if they were unrelated. “Worth now” is each slip’s payout times its chance, added up. It is not a cash-out price.'
    +'<br><a class="home" href="/">← Back to the site</a></div>';
  $('app').innerHTML=html;
  renderTop();
  booted=true;
}

/* ---------- loop ---------- */
async function loadSched(force){
  if(!force&&Date.now()-schedAt<600000)return;
  const teams=[...new Set((BETS.futures||[]).map(f=>f.team))];
  await Promise.all(teams.map(async t=>{try{SCHED[t]=await getJSON(API+'teams/'+t.toLowerCase()+'/schedule?season='+(BETS.season||'')+'&seasontype=2');}catch(e){}}));
  schedAt=Date.now();
}
async function tick(manual){
  clearTimeout(timer);let next=60000;
  try{
    const before=Object.fromEntries(Object.entries(G).map(([k,g])=>[k,g.state]));
    await Promise.all(BETS.games.map(async ev=>{G[ev.event]=buildGame(ev,await getJSON(API+'summary?event='+ev.event));}));
    const states=Object.values(G).map(g=>g.state);
    const ended=Object.entries(G).some(([k,g])=>before[k]&&before[k]!=='post'&&g.state==='post');
    await loadSched(ended);
    lastOk=Date.now();errMsg='';
    if(states.includes('in'))next=LIVE_MS;
    else if(states.includes('pre')){const soon=Object.values(G).some(g=>g.state==='pre'&&new Date(g.comp.date)-Date.now()<15*60000);next=soon?30000:120000;}
    else next=300000;
  }catch(e){
    errMsg='Can’t reach ESPN right now ('+(e.message||e)+'). Showing the last numbers; retrying.';
    next=20000;
  }
  if(Object.keys(G).length)render();else if(errMsg)$('app').innerHTML='<div class="err">'+esc(errMsg)+'</div>';
  if(!document.hidden)timer=setTimeout(tick,next);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else if(BETS)tick();});
setInterval(updAgo,1000);
(async()=>{
  try{BETS=await getJSON('/bets.json');}
  catch(e){
    // bets.json missing (or the page opened as a file): use the copy baked into this page
    try{BETS=JSON.parse($('bets-inline').textContent);}
    catch(e2){$('app').innerHTML='<div class="err">Couldn’t load the bets list ('+esc(e.message)+').</div>';return;}
  }
  if(BETS.games&&BETS.games[0]&&BETS.games[0].title)document.title='Live · '+BETS.games[0].title;
  tick();
})();
</script>
