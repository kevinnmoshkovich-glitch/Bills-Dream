<style>
:root{--bg:#080c16;--panel:#111a2c;--panel2:#0d1524;--line:#1f2b44;--mut:#7e91b4;--ink:#eaf0ff;--g:#5b8cff;--opp:#f2c14e;--win:#39d98a;--amb:#ffc24b;--lose:#ff5a6e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.top{position:sticky;top:0;z-index:10;background:rgba(8,12,22,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lose);margin-right:5px;vertical-align:1px;animation:pulse 1.4s infinite}
.dot.off{background:var(--mut);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,110,.65)}70%{box-shadow:0 0 0 7px rgba(255,90,110,0)}100%{box-shadow:0 0 0 0 rgba(255,90,110,0)}}
.stale{color:var(--amb)}
.hb{display:flex;align-items:center;gap:10px;padding:7px 12px 6px}
.mid{flex:0 0 auto;padding:0 6px 0 2px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--mut);cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mid .tap{color:#4d5f80}
.games{flex:1;min-width:0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.games::-webkit-scrollbar{display:none}
.gt{flex:0 0 auto;min-width:104px;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px 5px;display:flex;flex-direction:column;gap:2px}
.gt.in{border-color:rgba(91,140,255,.6);background:#101d36}
.gt.post{opacity:.7}
.tms{display:flex;justify-content:space-between;gap:10px;font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:.03em;color:#c6d5f2}
.tms .t b{margin-left:5px;font-weight:900;color:#fff;font-size:16px}
.tms .t.lead{color:#fff}
.gst{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;color:var(--mut);white-space:nowrap}
.gt.in .gst{color:#dfe8ff}
.gn{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#4d5f80;font-weight:700}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 8px;font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:19px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#dfe8ff;scroll-margin-top:12px}
.gh b{color:#fff;margin-left:6px}
.gh em{font-style:normal;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--mut);text-transform:none;letter-spacing:0;white-space:nowrap}
.gh em.in{color:#dfe8ff}
.lp{font-size:11.5px;color:#aebcd8;line-height:1.35;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp b{color:#fff;font-weight:600}
.ttl{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.legs{margin-top:6px}
#app{display:grid;grid-template-columns:minmax(420px,5fr) 7fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"sum board" "slips board";height:calc(100vh - var(--hh,120px))}
#sum{grid-area:sum;padding:12px 14px 0}
#slips{grid-area:slips;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 40px;min-height:0}
#board{grid-area:board;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 40px;min-height:0;border-left:1px solid var(--line)}
#slips::-webkit-scrollbar,#board::-webkit-scrollbar{width:8px} #slips::-webkit-scrollbar-thumb,#board::-webkit-scrollbar-thumb{background:#22314d;border-radius:4px}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;align-items:start}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px;align-items:start}
.slip,.pc{container-type:inline-size}
@container (min-width:500px){.legs{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.legs .lg:nth-child(2){border-top:0}}
@media(max-width:999px){#app{display:block;height:auto}#sum{padding:12px 16px 0}#slips,#board{overflow:visible;padding:0 16px 30px;border:0}}
@media(max-width:640px){.hb{display:block;padding:8px 12px 6px}.mid{padding:0 0 6px}.games{padding-bottom:2px}.slips,.pcs{grid-template-columns:1fr}}
h2{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;font-weight:800}
h2 small{font-family:Inter,system-ui,sans-serif;font-size:11px;letter-spacing:.04em;color:var(--mut);font-weight:500;text-transform:none;margin-left:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sum b{display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:18px;margin-top:3px}
.sum b.g{color:var(--win)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.chip{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;position:relative}
.chip .id{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:900;font-size:21px;line-height:1}
.chip .st{position:absolute;top:9px;right:10px;font-size:9.5px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}
.chip .ct{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#cfe0ff;margin-top:4px}
.chip .po{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--mut)}
.chip .dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.chip .dots i{width:8px;height:8px;border-radius:2px;background:#26344f}
.dots i.h{background:var(--win)} .dots i.c{background:var(--win);opacity:.7} .dots i.l{background:var(--lose)} .dots i.v{background:transparent;border:1px dashed #3a4a6a}
.alive .st{color:var(--g)} .won{border-color:rgba(57,217,138,.6)} .won .st{color:var(--win)} .lost{opacity:.55} .lost .st{color:var(--lose)}
.pc{margin-top:0}
.pc h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.pc h3 em{font-style:normal;font-family:Inter,system-ui,sans-serif;font-size:10.5px;letter-spacing:.06em;color:var(--mut);font-weight:600;text-transform:none;text-align:right}
.sl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;color:#9fb0cf;margin:3px 0 4px}
.row{padding:10px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.row:first-of-type{border-top:0}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rh span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.rh b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:20px;color:#fff}
.rh b small{font-size:11px;color:var(--mut);font-weight:500;margin-left:5px}
.bar{position:relative;height:10px;background:#0b1322;border:1px solid #22314d;border-radius:6px;margin:8px 0 16px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#3d6fe8,var(--g));transition:width .6s}
.bar .fill.done{background:linear-gradient(90deg,#20a86a,var(--win))}
.tk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#c6d5f2;border-radius:1px}
.tk.on{background:var(--win)}
.tk.cap{background:var(--amb)} .tk.cap span{color:var(--amb)} .tk.bad{background:var(--lose)} .tk.bad span{color:var(--lose)}
.mb.over i{background:var(--lose)}
.tk span{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--mut);white-space:nowrap}
.tk.on span{color:var(--win)}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:#c6d5f2}
.ch.ok{border-color:rgba(57,217,138,.55);color:var(--win)}
.ch.so{border-color:rgba(57,217,138,.4);color:#8fe6b8}
.ch.no{border-color:rgba(255,90,110,.5);color:var(--lose)}
.ch.vd{text-decoration:line-through;color:var(--mut)}
.pace{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;color:var(--mut);margin-left:auto}
.pips{display:flex;gap:5px;margin:9px 0 10px}
.pips i{width:16px;height:16px;border-radius:4px;background:#0b1322;border:1px solid #2a3a5a}
.pips i.on{background:var(--win);border-color:var(--win)}
.pips i.x{border-style:dashed}
.slip{margin-top:0;scroll-margin-top:12px}
.slip .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.slip .hd .id{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:900;font-size:30px;line-height:1}
.slip .hd .od{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--mut)}
.slip .hd .pay{margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;text-align:right}
.slip .hd .pay b{display:block;font-size:17px;color:#fff}
.slip.won .hd .pay b{color:var(--win)}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid}
.tag.alive{color:var(--g);border-color:rgba(91,140,255,.5)} .tag.won{color:var(--win);border-color:rgba(57,217,138,.6)} .tag.lost{color:var(--lose);border-color:rgba(255,90,110,.5)}
.need{font-size:12px;color:#aebcd8;margin:8px 0 2px;line-height:1.45}
.need b{color:#fff;font-weight:600}
.lg{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #192540}
.lg:first-of-type{border-top:0}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid #34466a;color:var(--mut)}
.lg.h .ic,.lg.w .ic{background:var(--win);border-color:var(--win);color:#062414}
.lg.c .ic{border-color:var(--win);color:var(--win)}
.lg.l .ic{background:var(--lose);border-color:var(--lose);color:#2a0710}
.lg.v{opacity:.5} .lg.v .nm{text-decoration:line-through}
.nm{font-size:13.5px;line-height:1.25}
.nm small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.vl{text-align:right;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;white-space:nowrap}
.vl small{display:block;font-size:10px;color:var(--mut)}
.mb{height:4px;background:#0b1322;border-radius:2px;margin-top:4px;overflow:hidden;width:78px;margin-left:auto}
.mb i{display:block;height:100%;background:var(--g)}
.lg.h .mb i,.lg.w .mb i,.lg.c .mb i{background:var(--win)}
.fl{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(91,140,255,.35)}100%{background:transparent}}

.fut .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

.fut .hd span{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--mut);white-space:nowrap}

.fut p b{color:#fff}
table.dv{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.dv td{padding:6px 4px;border-top:1px solid var(--line)}
table.dv td.n{text-align:right;font-family:'IBM Plex Mono'}
table.dv tr.me td{color:var(--g);font-weight:700}
.notes{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.notes b{color:#c6d5f2;font-weight:600}
.hurt{background:rgba(255,90,110,.1);border:1px solid rgba(255,90,110,.45);color:#ffd9df;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:10px}
.hurt b{color:#fff}
.ch.hr{border-color:rgba(255,90,110,.6);color:#ff9aa8}
.err{background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.4);color:var(--amb);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.loading{padding:60px 0;text-align:center;color:var(--mut)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:#0f2a1f;border:1px solid rgba(57,217,138,.6);color:#d9ffe9;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .3s ease-out}
.toast.bad{background:#2a0f16;border-color:rgba(255,90,110,.6);color:#ffd9df}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.home{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--mut)}
@media (max-width:420px){.sc{font-size:36px}.sum b{font-size:15px}.rh b{font-size:18px}}
</style>
</head>

<script>
'use strict';
/* /live — every open slip, across every game it touches, refreshed from ESPN's
   live box scores. Rebuilt 09/27/2026 for a Sunday slate: the first version
   tracked one game; slips now carry legs in up to six games with three
   kickoff windows, so each leg names its game and each game polls on its own
   clock (fast while it is on, slow before and after). */
const API='https://site.api.espn.com/apis/site/v2/sports/football/nfl/';
const STAT={
  pass_yds:{cat:'passing',key:'passingYards',lab:'passing yds',short:'pass yds',yards:1},
  pass_td:{cat:'passing',key:'passingTouchdowns',lab:'passing TD',short:'pass TD'},
  rush_yds:{cat:'rushing',key:'rushingYards',lab:'rushing yds',short:'rush yds',yards:1},
  rec_yds:{cat:'receiving',key:'receivingYards',lab:'receiving yds',short:'rec yds',yards:1},
  rec:{cat:'receiving',key:'receptions',lab:'receptions',short:'catches'},
  atd:{lab:'anytime TD',short:'TD'},
  ml:{lab:'to win',short:'win'}
};
const ORDER=['pass_yds','pass_td','rush_yds','rec_yds','rec','atd'];
const LIVE_MS=20000;   // a game that is on
const SOON_MS=30000;   // kickoff inside 15 minutes
const PRE_MS=120000;   // not started
const POST_MS=300000;  // final (stat corrections are rare but happen)
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Math.round(Number(n)).toLocaleString('en-US');
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]+/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,' ').replace(/\s+/g,' ').trim();
const surname=n=>{const w=String(n||'').split(' ').filter(x=>!/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(x));return w[w.length-1]||n};
const clockTime=iso=>new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

let BETS=null,G={},DUE={},SCHED={},schedAt=0,lastOk=0,timer=null,errMsg='',booted=false,inflight=false;
let prevVal={},prevLeg={},prevSlip={};

async function getJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- bets list shape ----------
   New shape: games[] (event, away, home, kick), lines{pid:{stat:line}},
   slips[] whose legs each carry ev (the game). The first version kept slips
   inside a single game; that shape is lifted into the new one here so an old
   list still renders. */
function normalizeBets(b){
  if(!b.slips){
    b.slips=[];b.lines=b.lines||{};
    for(const ev of b.games||[]){
      Object.assign(b.lines,ev.lines||{});
      for(const s of ev.slips||[]){for(const l of s.legs)l.ev=l.ev||ev.event;b.slips.push(s);}
    }
  }
  b.lines=b.lines||{};
  for(const g of b.games)g.event=String(g.event);
  for(const s of b.slips)for(const l of s.legs)l.ev=String(l.ev||'');
  return b;
}
const gameCfg=ev=>BETS.games.find(g=>g.event===String(ev));
const gameLegs=ev=>{const out=[];for(const s of BETS.slips)for(const l of s.legs)if(l.ev===String(ev))out.push({s,l});return out};
const gtag=ev=>{const c=gameCfg(ev);return c?c.away+'@'+c.home:''};

/* ---------- parse ESPN summary ---------- */
function parseBox(sum){
  const byId={},byName={};
  const teams=(sum.boxscore&&sum.boxscore.players)||[];
  for(const tp of teams){
    const team=tp.team&&tp.team.abbreviation;
    for(const cat of tp.statistics||[]){
      const keys=cat.keys||[];
      for(const a of cat.athletes||[]){
        const at=a.athlete||{};
        let r=byId[at.id];
        if(!r){r=byId[at.id]={id:at.id,name:at.displayName,team,c:{},s:{}};byName[norm(at.displayName)]=r;}
        const row={},raw={};
        keys.forEach((k,i)=>{row[k]=num(a.stats&&a.stats[i]);raw[k]=a.stats?a.stats[i]:'';});
        r.c[cat.name]=row;r.s[cat.name]=raw;
      }
    }
  }
  return{byId,byName};
}
function isTD(p){
  const a=[p.scoringType&&p.scoringType.name,p.scoringType&&p.scoringType.abbreviation,p.type&&p.type.text,p.type&&p.type.abbreviation].join(' ');
  return /touchdown|\bTD\b/i.test(a);
}
function clockFrac(st,state){
  if(state==='pre')return 0;
  if(state==='post')return 1;
  const p=st.period||1;if(p>4)return 1;
  let c=st.clock;
  if(c==null){const m=String(st.displayClock||'15:00').split(':');c=num(m[0])*60+num(m[1]);}
  return Math.min(1,Math.max(0,((p-1)*900+(900-c))/3600));
}
function allPlays(sum){
  const dr=sum.drives||{},seen=new Set(),out=[];
  for(const d of (dr.previous||[]).concat(dr.current?[dr.current]:[]))for(const p of d.plays||[]){
    const k=p.id||p.sequenceNumber||p.text;if(seen.has(k))continue;seen.add(k);out.push(p);}
  return out.sort((a,b)=>num(a.sequenceNumber)-num(b.sequenceNumber));
}
const PER=['','1st','2nd','3rd','4th','OT'];
/* A player the play-by-play says "was injured during the play", and who hasn't
   appeared in any play since, is treated as out: his open legs drop to 0%.
   The flag clears by itself the moment he shows up in a play again. */
function hurtMap(ev,plays){
  const m={},names=new Map();
  for(const {l} of gameLegs(ev))if(l.p&&!l.void)names.set(l.pid||norm(l.p),l.p);
  for(const [k,n] of names){
    const w=String(n).replace(/\b(Jr|Sr)\.?|\b(II|III|IV)\b/g,'').trim().split(/\s+/);
    const a=(w[0][0]+'.'+w[w.length-1]).replace(/\./g,'\\.').replace(/'/g,"'?");
    const any=new RegExp('\\b'+a+'\\b'),inj=new RegExp('\\b'+a+' was injured');
    let st=null;
    for(const p of plays){const t=p.text||'';if(!any.test(t))continue;
      if(inj.test(t))st={when:((p.clock&&p.clock.displayValue)||'')+' in the '+(PER[(p.period&&p.period.number)||0]||'game')};else st=null;}
    if(st)m[k]=Object.assign(st,{name:n});
  }
  return m;
}
function buildGame(cfg,sum){
  const comp=(sum.header&&sum.header.competitions&&sum.header.competitions[0])||{};
  const st=comp.status||{};const state=(st.type&&st.type.state)||'pre';
  const plays=allPlays(sum);
  return{cfg,ev:cfg.event,sum,comp,st,state,comps:comp.competitors||[],box:parseBox(sum),
    tdTexts:(sum.scoringPlays||[]).filter(isTD).map(p=>norm(p.text)+' '),
    frac:clockFrac(st,state),lastPlay:plays[plays.length-1]||null,
    hurt:state==='in'?hurtMap(cfg.event,plays):{}};
}
const gameOf=l=>G[l.ev]||null;
const hurtOf=(g,l)=>g&&l.p&&g.hurt?g.hurt[l.pid||norm(l.p)]:null;
function gameState(g,cfg){
  if(!g)return{txt:cfg&&cfg.kick?clockTime(cfg.kick):'—',cls:'pre'};
  if(g.state==='pre')return{txt:clockTime(g.comp.date||g.cfg.kick),cls:'pre'};
  if(g.state==='in')return{txt:(g.st.type&&g.st.type.shortDetail)||'Live',cls:'in'};
  return{txt:(g.st.type&&g.st.type.shortDetail)||'Final',cls:'post'};
}
const score=(g,ab)=>{const c=g&&g.comps.find(x=>x.team&&x.team.abbreviation===ab);return c?num(c.score):0};

/* ---------- legs ---------- */
const player=(g,l)=>g?((l.pid&&g.box.byId[l.pid])||g.box.byName[norm(l.p)]||null):null;
function tds(g,l){
  const r=player(g,l);let n=0;
  if(r)for(const cat in r.c)for(const k in r.c[cat])if(/Touchdowns$/.test(k)&&k!=='passingTouchdowns'&&k!=='defensiveTouchdowns')n+=r.c[cat][k];
  const nn=norm(l.p)+' ';let s=0;for(const t of g.tdTexts)if(t.startsWith(nn))s++;
  return Math.max(n,s);
}
function value(g,l){
  if(!g)return 0;
  if(l.stat==='atd')return tds(g,l);
  const d=STAT[l.stat],r=player(g,l);
  return r&&r.c[d.cat]?(r.c[d.cat][d.key]||0):0;
}
function moneyline(g,team){
  const me=g.comps.find(c=>c.team&&c.team.abbreviation===team)||{},op=g.comps.find(c=>c!==me)||{};
  const a=num(me.score),b=num(op.score);let wp=null;
  const w=g.sum.winprobability;
  if(g.state==='in'&&w&&w.length){let h=num(w[w.length-1].homeWinPercentage);if(h>1)h/=100;wp=me.homeAway==='home'?h:1-h;}
  else if(g.state==='pre'&&g.sum.predictor){const s=me.homeAway==='home'?g.sum.predictor.homeTeam:g.sum.predictor.awayTeam;if(s&&s.gameProjection!=null)wp=num(s.gameProjection)/100;}
  else if(g.state==='post')wp=a>b?1:a<b?0:null;
  return{a,b,wp,me,op};
}
function evalLeg(g,l){
  if(l.void)return{st:'void'};
  if(!g)return{cur:0,t:l.min,need:l.min,st:'live',nog:true};
  const post=g.state==='post';
  if(l.stat==='ml'){const m=moneyline(g,l.team);return Object.assign(m,{st:post?(m.a>m.b?'won':m.a<m.b?'lost':'void'):'live'});}
  const d=STAT[l.stat],cur=value(g,l);let st;
  if(l.max!=null){ // an UNDER leg: dead the moment it goes over, only won at the final whistle
    const mx=l.max;
    if(cur>=mx)st='lost';else st=post?'won':'live';
    return{cur,t:mx,under:true,room:Math.max(0,mx-cur),need:0,st};
  }
  const t=l.min;
  if(cur>=t)st=post?'won':(d.yards?'clear':'hit');else st=post?'lost':'live';
  return{cur,t,need:Math.max(0,t-cur),st};
}
const HIT=s=>s==='hit'||s==='won'||s==='clear';
/* ---------- live chance (rough) ----------
   Each leg starts from the sportsbook line for that player ("lines" in the bets
   list) and blends in how the player is actually going: the observed pace gets
   weight equal to the share of the game played. Yardage: log-normal around that
   expectation for the time left, spread widening as time runs out. Catches /
   TDs: Poisson for the time left. Anytime TD prior = expected scrimmage yards /
   110. Slip chance multiplies the legs as if they were independent, so it's a
   guide, not a price. */
const CV={pass_yds:.30,rush_yds:.50,rec_yds:.60};
function ncdf(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2);const q=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-q:q}
function poisAtLeast(k,lam){if(k<=0)return 1;if(lam<=0)return 0;let term=Math.exp(-lam),cdf=term;for(let i=1;i<k;i++){term*=lam/i;cdf+=term}return Math.max(0,Math.min(1,1-cdf))}
function prior(l){
  const L=(BETS.lines||{})[l.pid]||{};
  if(l.stat==='atd'){const y=(L.rush_yds||0)+(L.rec_yds||0);return y?Math.max(.03,y/110):null}
  return L[l.stat]!=null?L[l.stat]:null;
}
function chance(g,l,r){
  if(r.st==='void')return null;
  if(!g)return null;
  if(l.stat==='ml')return r.wp;
  if(HIT(r.st))return 1;
  if(r.st==='lost'||g.state==='post')return 0;
  if(hurtOf(g,l))return 0;
  const f=g.frac,rem=1-f;if(rem<=.0005)return 0;
  const K=1.5,base=prior(l);
  let full;
  if(base==null){if(f<=.02)return null;full=r.cur/f}
  else full=(K*base+r.cur)/(K+f);
  const need=r.t-r.cur;
  if(need<=0)return r.under?0:1;
  let pr;
  if(!STAT[l.stat].yards)pr=poisAtLeast(need,Math.max(1e-4,full*rem));
  else{
    const m=Math.max(.5,full*rem),cv=Math.min(2.5,(CV[l.stat]||.5)/Math.sqrt(rem)),sg=Math.sqrt(Math.log(1+cv*cv));
    pr=1-ncdf((Math.log(need)-Math.log(m))/sg);
    const L=(BETS.lines||{})[l.pid]||{};
    if(l.stat==='rec_yds'&&L.rec){const rc=value(g,{stat:'rec',p:l.p,pid:l.pid}),rate=(K*L.rec+rc)/(K+f);pr*=1-Math.exp(-rate*rem)}
  }
  return r.under?1-pr:pr;
}
const pct=p=>p==null?'':p>=.995?'99%':p<.01?(p<=0?'0%':'<1%'):Math.round(p*100)+'%';
const pct1=p=>p==null?'':p>=.995?'99%':p<.001?(p<=0?'0%':'<0.1%'):p<.1?(p*100).toFixed(1)+'%':Math.round(p*100)+'%';
function evalSlip(s){
  const legs=s.legs.map(l=>{const g=gameOf(l),r=evalLeg(g,l);return{l,g,r,p:chance(g,l,r)}});
  const act=legs.filter(x=>x.r.st!=='void');
  const hit=act.filter(x=>HIT(x.r.st)).length;
  let st='alive';

function legName(g,l,withName){

function futures(){

        if(me&&me.winner)w++;else if(op&&op.winner)l++;else t++;}

        :'<p>Record <b>'+rec+'</b>'+(live?' (today not counted yet)':'')+'. Needs <b>'+more+' more wins</b> from '+left+' games left ('+needW+' total).</p>';
    }

          +'<table class="dv">'+rows.map(r=>'<tr class="'+(r.ab===f.team?'me':'')+'"><td>'+esc(r.name)+'</td><td class="n">'+r.w+'–'+r.l+(r.t?'–'+r.t:'')+'</td></tr>').join('')+'</table>';

    const dots=r.legs.map(x=>'<i class="'+({hit:'h',won:'h',clear:'c',lost:'l',void:'v',live:''}[x.r.st])+'"></i>').join('');
    const lab=r.st==='won'?'won':r.st==='lost'?'out':'alive';
    return '<a class="chip '+r.st+'" href="#slip-'+esc(s.id)+'"><span class="id">'+esc(s.id)+'</span><span class="st">'+lab+'</span><div class="ct">'+r.hit+'/'+r.act.length+' in'+(r.st==='alive'&&r.p!=null?' · '+pct1(r.p):'')+'</div><div class="po">'+money0(s.payout)+'</div><div class="dots">'+dots+'</div></a>';
  }).join('')+'</div>';
  $('sum').innerHTML=top;
  $('slips').innerHTML='<h2>Your slips<small>'+esc(BETS.sub||'FanDuel · '+BETS.slips.length+' open')+'</small></h2><div class="slips">'+res.map((r,i)=>slipCard(BETS.slips[i],r,flash)).join('')+'</div>'+futures()
    +'<div class="notes"><b>How legs are counted.</b> Anytime TD = a rushing, receiving or return touchdown (a passing TD doesn’t count for the passer); “2+ TDs” needs two of those. An <b>under</b> leg is dead the moment the number goes over and only wins at the final whistle, so it never shows a check mark early. A yardage leg over its number shows <b>“over so far”</b> until the final whistle, because a sack, kneel-down or loss can pull the total back under. Numbers come from ESPN’s live box scores; a game refreshes every 20 seconds while it is on, every couple of minutes before kickoff, and every five minutes after the final. FanDuel settles on official stats.<br><b>*Chances are a rough guide.</b> Each leg starts from the sportsbook line for that player and shifts toward how he’s actually playing as the game goes on (the line counts as about a game and a half of evidence); a slip’s chance multiplies its legs as if they were unrelated, which understates a same-game parlay. “Worth now” is each slip’s payout times its chance, added up. It is not a cash-out price.'
    +'<br><a class="home" href="/">← Back to the site</a></div>';
  $('board').innerHTML='<h2>By player<small>every line you need, live, game by game</small></h2>'+board(flash);
  renderTop();fitHeader();
  booted=true;
}

/* ---------- loop ---------- */
async function loadSched(force){
  if(!force&&Date.now()-schedAt<600000)return;
  const teams=[...new Set((BETS.futures||[]).map(f=>f.team))];
  await Promise.all(teams.map(async t=>{try{SCHED[t]=await getJSON(API+'teams/'+t.toLowerCase()+'/schedule?season='+(BETS.season||'')+'&seasontype=2');}catch(e){}}));
  schedAt=Date.now();
}
function waitFor(g){
  if(!g)return SOON_MS;
  if(g.state==='in')return LIVE_MS;
  if(g.state==='post')return POST_MS;
  const ms=new Date(g.comp.date||g.cfg.kick)-Date.now();
  return ms<15*60000?SOON_MS:PRE_MS;
}
async function tick(manual){
  clearTimeout(timer);
  if(inflight){if(!document.hidden)timer=setTimeout(tick,3000);return;}
  inflight=true;
  try{
    const now=Date.now();
    const due=BETS.games.filter(c=>manual||!DUE[c.event]||DUE[c.event]<=now);
    let failed=0,ended=false;
    await Promise.all(due.map(async cfg=>{
      try{
        const was=G[cfg.event]&&G[cfg.event].state;
        G[cfg.event]=buildGame(cfg,await getJSON(API+'summary?event='+cfg.event));
        if(was&&was!=='post'&&G[cfg.event].state==='post')ended=true;
        DUE[cfg.event]=Date.now()+waitFor(G[cfg.event]);
      }catch(e){failed++;DUE[cfg.event]=Date.now()+20000;}
    }));
    if(failed&&failed===due.length&&due.length)throw new Error('no game answered');
    if(Object.keys(G).length)await loadSched(ended);
    if(!failed){lastOk=Date.now();errMsg='';}
    else errMsg=failed+' of '+due.length+' games didn’t answer; showing the last numbers for those.';
  }catch(e){
    errMsg='Can’t reach ESPN right now ('+(e.message||e)+'). Showing the last numbers; retrying.';
  }
  inflight=false;
  if(Object.keys(G).length)render();else if(errMsg){$('sum').innerHTML='<div class="err">'+esc(errMsg)+'</div>';renderTop();fitHeader();}
  // wake up when the soonest game is due (never longer than a minute so the clock stays honest)
  const next=Math.max(3000,Math.min(60000,...BETS.games.map(c=>(DUE[c.event]||0)-Date.now())));
  if(!document.hidden)timer=setTimeout(tick,next);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else if(BETS)tick(true);});
setInterval(updAgo,1000);
window.addEventListener('resize',fitHeader);
(async()=>{
  try{BETS=await getJSON('/bets.json');}
  catch(e){
    try{BETS=JSON.parse($('bets-inline').textContent);}
    catch(e2){$('sum').innerHTML='<div class="err">Couldn’t load the bets list ('+esc(e.message)+').</div>';return;}
  }
  normalizeBets(BETS);
  document.title='Live · Week '+(BETS.week||'');
  $('mid').onclick=()=>tick(true);
  tick(true);
})();
</script>
